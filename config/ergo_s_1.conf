# User Configuration for ${keyboard.name}

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
CONFIG_ZMK_MOUSE=y

# Desactiva el escaneo automático de todos los perfiles al iniciar
CONFIG_ZMK_BLE_SELECT_RELAY=n

# Fuerza a que solo se conecte al perfil activo actualmente
CONFIG_ZMK_BLE_PASSIVE_SCAN_REPLY=y

# Ayuda a que el central no salte entre dispositivos.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
