# User Configuration for ${keyboard.name}

# Configuración de Encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Habilitar soporte de Ratón
CONFIG_ZMK_MOUSE=y

# --- ESTABILIDAD BLUETOOTH ---

# Fuerza a que el teclado no intente conectar a todos los dispositivos a la vez
# Esto suele solucionar el "salto" entre perfiles.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Aumenta la potencia de la antena (ayuda si hay interferencias o cortes)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Ayuda con la batería en teclados split
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# --- ZMK STUDIO ---
# Si vas a usar ZMK Studio, asegúrate de que esta línea esté presente:
CONFIG_ZMK_STUDIO=y
